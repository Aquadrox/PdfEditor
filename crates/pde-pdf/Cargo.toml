[package]
name = "pde-pdf"
description = "Moteur PDF : ouverture, rendu et texte des pages, via PDFium"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
pde-core = { path = "../pde-core" }
pde-fonts = { path = "../pde-fonts" }
# Fonctions de PDFium 8125 : la bibliothèque téléchargée par
# scripts/fetch-pdfium.sh doit être de la même version.
# Écriture des champs de formulaire et des propriétés du document, que
# PDFium ne sait pas écrire (Rust pur, MIT ; sans ses options par défaut).
lopdf = { version = "0.47", default-features = false }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }

[dev-dependencies]
# Parcours complet d'un formulaire importé de Word (tests seulement).
pde-docx = { path = "../pde-docx" }
# Fichiers JPEG fabriqués par les tests d'images.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Images de référence des tests de rendu.
png = "0.18"

[lints]
workspace = true
