[package]
name = "pde-app"
description = "Cas d'usage de l'éditeur, testables sans interface"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Images de signature manuscrite envoyées par l'interface (PNG en base64).
base64 = "0.23"
# Images ajoutées aux documents (E-02) : PNG, JPEG, WebP, en Rust pur.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4"
pde-core = { path = "../pde-core" }
# IA : tâches sur le document, client compatible OpenAI (sans transport réel).
pde-ai = { path = "../pde-ai" }
# Caractères qu'aucune police ne couvre (signalés dans l'interface).
pde-fonts = { path = "../pde-fonts" }
png = "0.18"
# Signature des documents (PAdES), identités et vérification.
pde-sign = { path = "../pde-sign" }
serde.workspace = true
# Empreinte du PDF d'origine : une sauvegarde automatique ne se réapplique
# qu'au même fichier.
sha2 = "0.10"
serde_json = "1"
thiserror.workspace = true
# Serveur d'horodatage (RFC 3161) en HTTP : sans TLS, donc sans code C à
# compiler (Android) ; le jeton rendu est signé par le serveur.
ureq = { version = "3", default-features = false }
# Clé privée effacée de la mémoire après usage.
zeroize = "1"

[dev-dependencies]
# Serveur d'horodatage simulé pour les tests de signature.
pde-sign = { path = "../pde-sign", features = ["testing"] }
pde-ai = { path = "../pde-ai", features = ["testing"] }

[lints]
workspace = true
