[package]
name = "pde-app"
description = "Cas d'usage de l'éditeur, testables sans interface"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Images ajoutées aux documents (E-02) : PNG, JPEG, WebP, en Rust pur.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4"
pde-core = { path = "../pde-core" }
png = "0.18"
serde.workspace = true
# Empreinte du PDF d'origine : une sauvegarde automatique ne se réapplique
# qu'au même fichier.
sha2 = "0.10"
serde_json = "1"
thiserror.workspace = true

[lints]
workspace = true
