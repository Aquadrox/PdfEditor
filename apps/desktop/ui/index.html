<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>PdfEditor</title>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/viewer.css" />
    <link rel="stylesheet" href="styles/home.css" />
    <link rel="stylesheet" href="styles/dialog.css" />
    <link rel="stylesheet" href="styles/settings.css" />
    <link rel="stylesheet" href="styles/edit.css" />
    <link rel="stylesheet" href="styles/pages.css" />
    <link rel="stylesheet" href="styles/form.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!-- Icônes : Lucide (licence ISC), un symbole par sens, le même partout. -->

      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></symbol>

      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16" /></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21" /></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></symbol>

      <symbol id="i-rotate-left" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></symbol>
      <symbol id="i-rotate-right" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" /></symbol>
      <symbol id="i-highlighter" viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3" /><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" /></symbol>

      <symbol id="i-square" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1" /></symbol>

      <symbol id="i-al-left" viewBox="0 0 24 24"><path d="M4 2v20" /><rect x="8" y="6" width="12" height="4" /><rect x="8" y="14" width="7" height="4" /></symbol>
      <symbol id="i-al-center" viewBox="0 0 24 24"><path d="M12 2v20" /><rect x="6" y="6" width="12" height="4" /><rect x="8.5" y="14" width="7" height="4" /></symbol>
      <symbol id="i-al-right" viewBox="0 0 24 24"><path d="M20 2v20" /><rect x="4" y="6" width="12" height="4" /><rect x="9" y="14" width="7" height="4" /></symbol>
      <symbol id="i-al-top" viewBox="0 0 24 24"><path d="M2 4h20" /><rect x="6" y="8" width="4" height="12" /><rect x="14" y="8" width="4" height="7" /></symbol>
      <symbol id="i-al-middle" viewBox="0 0 24 24"><path d="M2 12h20" /><rect x="6" y="6" width="4" height="12" /><rect x="14" y="8.5" width="4" height="7" /></symbol>
      <symbol id="i-al-bottom" viewBox="0 0 24 24"><path d="M2 20h20" /><rect x="6" y="4" width="4" height="12" /><rect x="14" y="9" width="4" height="7" /></symbol>

      <symbol id="i-dist-y" viewBox="0 0 24 24"><path d="M3 3h18M3 21h18" /><rect x="7" y="9" width="10" height="6" /></symbol>
      <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" /><path d="M14 3v6h6M12 18v-6M9 15h6" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2" /><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2" /></symbol>
      <symbol id="i-file-out" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7" /><path d="M14 3v6h6v4M15 18h6M18 15l3 3-3 3" /></symbol>

      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6" /></symbol>
      <symbol id="i-file-up" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" /><path d="M14 3v6h6M12 18v-6M9 15l3-3 3 3" /></symbol>
    </svg>

    <div class="app">
      <header class="topbar">
        <button id="menu-button" class="btn ghost icon" data-i18n-label="menu.label">
          <svg class="icon"><use href="#i-menu" /></svg>
        </button>
        <div id="main-menu" class="menu" role="menu" hidden>
          <button id="menu-open" role="menuitem"><span data-i18n="menu.open"></span><kbd data-shortcut="open"></kbd></button>
          <button id="menu-save" role="menuitem" disabled><span data-i18n="menu.save"></span><kbd data-shortcut="save"></kbd></button>
          <button id="menu-save-as" role="menuitem" disabled><span data-i18n="menu.saveAs"></span><kbd data-shortcut="save_as"></kbd></button>
          <button id="menu-close" role="menuitem" disabled><span data-i18n="menu.close"></span><kbd data-shortcut="close"></kbd></button>
          <button id="menu-properties" role="menuitem" disabled><span data-i18n="menu.properties"></span></button>
          <button id="menu-flatten" role="menuitem" disabled><span data-i18n="menu.flatten"></span></button>
          <button id="menu-settings" role="menuitem"><span data-i18n="menu.settings"></span><kbd data-shortcut="settings"></kbd></button>
        </div>
        <span class="doc-title">
          <span id="doc-name" class="doc-name"></span>
          <span id="doc-dirty" class="dirty-dot" role="img" data-i18n-label="status.unsaved" hidden></span>
        </span>
        <nav class="modes" data-i18n-aria="modes.label">
          <button id="mode-read" class="mode" aria-current="page"><svg class="icon"><use href="#i-read" /></svg><span data-i18n="mode.read"></span></button>
          <button id="mode-edit" class="mode" disabled><svg class="icon"><use href="#i-edit" /></svg><span data-i18n="mode.edit"></span></button>
          <button id="mode-pages" class="mode" disabled><svg class="icon"><use href="#i-pages" /></svg><span data-i18n="mode.pages"></span></button>
          <button class="mode" disabled data-i18n-title="mode.soon"><svg class="icon"><use href="#i-sign" /></svg><span data-i18n="mode.sign"></span></button>
          <button class="mode" disabled data-i18n-title="mode.soon"><svg class="icon"><use href="#i-ai" /></svg><span data-i18n="mode.ai"></span></button>
        </nav>
        <button id="search-button" class="btn ghost icon" disabled data-i18n-label="search.open" data-shortcut-hint="search">
          <svg class="icon"><use href="#i-search" /></svg>
        </button>
        <button id="save-button" class="btn primary" data-i18n="menu.save" data-i18n-label="menu.save" data-shortcut-hint="save" hidden></button>
      </header>

      <div id="edit-toolbar" class="edit-toolbar" role="toolbar" data-i18n-aria="edit.toolbar" hidden>
        <button id="tool-text" class="btn on" aria-pressed="true"><svg class="icon"><use href="#i-type" /></svg><span data-i18n="edit.text"></span></button>
        <button id="tool-image" class="btn ghost" data-i18n-title="edit.imageHint"><svg class="icon"><use href="#i-image" /></svg><span data-i18n="edit.image"></span></button>
        <button id="tool-markup" class="btn ghost" aria-pressed="false" data-i18n-title="edit.markupHint"><svg class="icon"><use href="#i-highlighter" /></svg><span data-i18n="edit.markup"></span></button>
        <button id="tool-ink" class="btn ghost" aria-pressed="false" data-i18n-title="edit.inkHint"><svg class="icon"><use href="#i-pencil" /></svg><span data-i18n="edit.ink"></span></button>
        <button id="tool-shape" class="btn ghost" aria-pressed="false" data-i18n-title="edit.shapeHint"><svg class="icon"><use href="#i-shapes" /></svg><span data-i18n="edit.shape"></span></button>
        <button id="tool-note" class="btn ghost" aria-pressed="false" data-i18n-title="edit.noteHint"><svg class="icon"><use href="#i-note" /></svg><span data-i18n="edit.note"></span></button>
        <button id="tool-redact" class="btn ghost" aria-pressed="false" data-i18n-title="edit.redactHint"><svg class="icon"><use href="#i-redact" /></svg><span data-i18n="edit.redact"></span></button>
        <span class="separator" aria-hidden="true"></span>
        <span class="tool-options" data-tool-options="text">
        <select class="input font-select" data-style="font" data-i18n-aria="edit.font" data-i18n-title="edit.font">
          <option value="sans" data-i18n="font.sans"></option>
          <option value="serif" data-i18n="font.serif"></option>
          <option value="mono" data-i18n="font.mono"></option>
        </select>
        <span class="with-unit">
          <input class="input num size-input" type="number" min="4" max="200" step="0.5" data-style="size" data-i18n-aria="edit.size" />
          <span class="unit" aria-hidden="true">pt</span>
        </span>
        <button class="btn ghost icon bold" data-style="bold" data-i18n-label="edit.bold">G</button>
        <button class="btn ghost icon italic" data-style="italic" data-i18n-label="edit.italic">I</button>
        <input class="color-input" type="color" data-style="color" data-i18n-aria="edit.color" />
        </span>
        <span class="tool-options" data-tool-options="markup" hidden>
          <span class="segmented">
            <button class="btn ghost icon" data-annot="mark" data-value="highlight" data-i18n-label="edit.mark.highlight"><svg class="icon"><use href="#i-highlighter" /></svg></button>
            <button class="btn ghost icon" data-annot="mark" data-value="underline" data-i18n-label="edit.mark.underline"><svg class="icon"><use href="#i-underline" /></svg></button>
            <button class="btn ghost icon" data-annot="mark" data-value="strike_out" data-i18n-label="edit.mark.strike_out"><svg class="icon"><use href="#i-strike" /></svg></button>
          </span>
          <span class="swatches" data-annot-swatches></span>
        </span>
        <span class="tool-options" data-tool-options="ink" hidden>
          <span class="swatches" data-annot-swatches></span>
          <span class="with-unit">
            <input class="input num size-input" type="number" min="0.25" max="48" step="0.5" data-annot="width" data-i18n-aria="edit.width" data-i18n-title="edit.width" />
            <span class="unit" aria-hidden="true">pt</span>
          </span>
        </span>
        <span class="tool-options" data-tool-options="shape" hidden>
          <span class="segmented">
            <button class="btn ghost icon" data-annot="shape" data-value="rectangle" data-i18n-label="edit.shape.rectangle"><svg class="icon"><use href="#i-square" /></svg></button>
            <button class="btn ghost icon" data-annot="shape" data-value="ellipse" data-i18n-label="edit.shape.ellipse"><svg class="icon"><use href="#i-circle" /></svg></button>
            <button class="btn ghost icon" data-annot="shape" data-value="line" data-i18n-label="edit.shape.line"><svg class="icon"><use href="#i-line" /></svg></button>
            <button class="btn ghost icon" data-annot="shape" data-value="arrow" data-i18n-label="edit.shape.arrow"><svg class="icon"><use href="#i-arrow" /></svg></button>
          </span>
          <span class="swatches" data-annot-swatches></span>
          <span class="with-unit">
            <input class="input num size-input" type="number" min="0.25" max="48" step="0.5" data-annot="width" data-i18n-aria="edit.width" data-i18n-title="edit.width" />
            <span class="unit" aria-hidden="true">pt</span>
          </span>
          <label class="checkbox"><input type="checkbox" data-annot="filled" /><span data-i18n="edit.filled"></span></label>
        </span>
        <span class="tool-options" data-tool-options="redact" hidden>
          <span class="tool-hint" data-i18n="edit.redactOptions"></span>
        </span>
        <span class="tool-options" data-tool-options="note" hidden>
          <span class="swatches" data-annot-swatches></span>
        </span>
        <span class="spacer"></span>
        <button id="edit-undo" class="btn ghost icon" disabled data-i18n-label="edit.undo" data-shortcut-hint="undo"><svg class="icon"><use href="#i-undo" /></svg></button>
        <button id="edit-redo" class="btn ghost icon" disabled data-i18n-label="edit.redo" data-shortcut-hint="redo"><svg class="icon"><use href="#i-redo" /></svg></button>
      </div>

      <div id="pages-toolbar" class="edit-toolbar" role="toolbar" data-i18n-aria="pages.toolbar" hidden>
        <button id="pages-insert" class="btn ghost" data-i18n-title="pages.insertHint"><svg class="icon"><use href="#i-file-plus" /></svg><span data-i18n="pages.insert"></span></button>
        <button id="pages-insert-pdf" class="btn ghost" data-i18n-title="pages.insertPdfHint"><svg class="icon"><use href="#i-file-up" /></svg><span data-i18n="pages.insertPdf"></span></button>
        <button id="pages-duplicate" class="btn ghost" data-i18n-title="pages.duplicateHint"><svg class="icon"><use href="#i-copy" /></svg><span data-i18n="pages.duplicate"></span></button>
        <span class="separator" aria-hidden="true"></span>
        <button id="pages-rotate-left" class="btn ghost icon" data-i18n-label="pages.rotateLeft"><svg class="icon"><use href="#i-rotate-left" /></svg></button>
        <button id="pages-rotate-right" class="btn ghost icon" data-i18n-label="pages.rotateRight"><svg class="icon"><use href="#i-rotate-right" /></svg></button>
        <span class="separator" aria-hidden="true"></span>
        <button id="pages-extract" class="btn ghost" data-i18n-title="pages.extractHint"><svg class="icon"><use href="#i-file-out" /></svg><span data-i18n="pages.extract"></span></button>
        <button id="pages-remove" class="btn ghost" data-i18n-title="pages.removeHint"><svg class="icon"><use href="#i-trash" /></svg><span data-i18n="pages.remove"></span></button>
        <span id="pages-count" class="pages-count" role="status"></span>
        <span class="spacer"></span>
        <span class="pages-hint" data-i18n="pages.hint"></span>
        <button id="pages-undo" class="btn ghost icon" disabled data-i18n-label="edit.undo" data-shortcut-hint="undo"><svg class="icon"><use href="#i-undo" /></svg></button>
        <button id="pages-redo" class="btn ghost icon" disabled data-i18n-label="edit.redo" data-shortcut-hint="redo"><svg class="icon"><use href="#i-redo" /></svg></button>
      </div>

      <div id="update-banner" class="banner" role="status" hidden>
        <span id="update-text" class="banner-text"></span>
        <button id="update-notes-toggle" class="btn ghost" aria-expanded="false" data-i18n="updates.notes"></button>
        <button id="update-install" class="btn primary" data-i18n="updates.install"></button>
        <div id="update-notes" class="banner-notes" hidden></div>
      </div>
      <div id="updated-banner" class="banner" role="status" hidden>
        <span id="updated-text" class="banner-text"></span>
        <button id="updated-notes-toggle" class="btn ghost" aria-expanded="false" data-i18n="updates.notes"></button>
        <button id="updated-close" class="btn ghost icon" data-i18n-label="updates.close"><svg class="icon"><use href="#i-x" /></svg></button>
        <div id="updated-notes" class="banner-notes" hidden></div>
      </div>

      <div class="workspace">
        <aside id="sidebar" class="sidebar" data-i18n-aria="sidebar.label" hidden>
          <div class="sidebar-tabs" role="tablist">
            <button id="tab-pages" class="btn on" role="tab" aria-selected="true" data-i18n="sidebar.pages"></button>
            <button id="tab-outline" class="btn ghost" role="tab" aria-selected="false" data-i18n="sidebar.outline"></button>
          </div>
          <div id="sidebar-body" class="sidebar-body">
            <div id="thumbs" class="thumbs"></div>
            <nav id="outline" class="outline" hidden></nav>
          </div>
        </aside>

        <div id="search-bar" class="search-bar" role="search" hidden>
          <input id="search-input" class="input" type="search" data-i18n-aria="search.label" data-i18n-placeholder="search.placeholder" />
          <span id="search-count" class="search-count num" aria-live="polite"></span>
          <button id="search-previous" class="btn ghost icon" data-i18n-label="search.previous"><svg class="icon"><use href="#i-up" /></svg></button>
          <button id="search-next" class="btn ghost icon" data-i18n-label="search.next"><svg class="icon"><use href="#i-down" /></svg></button>
          <button id="search-close" class="btn ghost icon" data-i18n-label="search.close"><svg class="icon"><use href="#i-x" /></svg></button>
        </div>

        <section id="page-grid" class="page-grid" tabindex="0" hidden></section>

        <main id="desk" class="desk" tabindex="0" data-i18n-aria="desk.label">
          <section id="home" class="home">
            <div id="drop-sheet" class="drop-sheet">
              <svg class="icon" aria-hidden="true"><use href="#i-file-up" /></svg>
              <h1 class="drop-title" data-i18n="home.title"></h1>
              <p class="drop-hint" data-i18n="home.hint"></p>
              <button id="home-open" class="btn primary large" data-i18n="home.open"></button>
              <kbd data-shortcut="open"></kbd>
            </div>
            <section id="recent" class="recent-panel" aria-labelledby="recent-title" hidden>
              <div class="recent-header">
                <h2 id="recent-title" class="panel-title" data-i18n="recent.title"></h2>
                <button id="recent-clear" class="btn ghost" data-i18n="recent.clear"></button>
              </div>
              <ul id="recent-list" class="recent-list"></ul>
            </section>
          </section>
        </main>

        <aside id="properties" class="properties" aria-labelledby="properties-title" hidden>
          <div class="properties-header">
            <h2 id="properties-title" class="panel-title" data-i18n="props.title"></h2>
            <button id="prop-close" class="btn ghost icon" data-i18n-label="props.close"><svg class="icon"><use href="#i-x" /></svg></button>
          </div>
          <p id="prop-empty" class="properties-empty" data-i18n="props.empty"></p>
          <div id="prop-fields" class="properties-fields">
          <div id="prop-text-fields" class="properties-fields">
          <div class="properties-group">
            <label class="caption" for="prop-text" data-i18n="props.text"></label>
            <textarea id="prop-text" class="input prop-text" rows="3"></textarea>
            <p id="prop-missing" class="notice" role="status" hidden></p>
          </div>
          <div class="properties-group">
            <div class="row2">
              <label class="stacked"><span class="caption" data-i18n="edit.font"></span>
                <select class="input" data-style="font">
                  <option value="sans" data-i18n="font.sans"></option>
                  <option value="serif" data-i18n="font.serif"></option>
                  <option value="mono" data-i18n="font.mono"></option>
                </select>
              </label>
              <label class="stacked"><span class="caption" data-i18n="edit.sizePt"></span>
                <input class="input num" type="number" min="4" max="200" step="0.5" data-style="size" />
              </label>
            </div>
            <span class="caption" data-i18n="edit.color"></span>
            <div id="prop-swatches" class="swatches"></div>
            <span class="caption" data-i18n="props.align"></span>
            <div class="segmented">
              <button class="btn ghost icon" data-style="align" data-value="left" data-i18n-label="props.left"><svg class="icon"><use href="#i-align-left" /></svg></button>
              <button class="btn ghost icon" data-style="align" data-value="center" data-i18n-label="props.center"><svg class="icon"><use href="#i-align-center" /></svg></button>
              <button class="btn ghost icon" data-style="align" data-value="right" data-i18n-label="props.right"><svg class="icon"><use href="#i-align-right" /></svg></button>
            </div>
          </div>
          </div>
          <div id="prop-note-fields" class="properties-group" hidden>
            <label class="caption" for="prop-note" data-i18n="props.noteText"></label>
            <textarea id="prop-note" class="input prop-text" rows="5" data-i18n-placeholder="props.notePlaceholder"></textarea>
            <span id="prop-note-author" class="caption"></span>
          </div>
          <p id="prop-redact-hint" class="properties-hint" data-i18n="props.redactHint" hidden></p>
          <div id="prop-annot-fields" class="properties-group" hidden>
            <span class="caption" data-annot-only="markup" data-i18n="props.mark"></span>
            <div class="segmented" data-annot-only="markup">
              <button class="btn ghost icon" data-annot="mark" data-value="highlight" data-i18n-label="edit.mark.highlight"><svg class="icon"><use href="#i-highlighter" /></svg></button>
            <button class="btn ghost icon" data-annot="mark" data-value="underline" data-i18n-label="edit.mark.underline"><svg class="icon"><use href="#i-underline" /></svg></button>
            <button class="btn ghost icon" data-annot="mark" data-value="strike_out" data-i18n-label="edit.mark.strike_out"><svg class="icon"><use href="#i-strike" /></svg></button>
            </div>
            <span class="caption" data-annot-only="shape" data-i18n="props.shape"></span>
            <div class="segmented" data-annot-only="shape">
              <button class="btn ghost icon" data-annot="shape" data-value="rectangle" data-i18n-label="edit.shape.rectangle"><svg class="icon"><use href="#i-square" /></svg></button>
            <button class="btn ghost icon" data-annot="shape" data-value="ellipse" data-i18n-label="edit.shape.ellipse"><svg class="icon"><use href="#i-circle" /></svg></button>
            <button class="btn ghost icon" data-annot="shape" data-value="line" data-i18n-label="edit.shape.line"><svg class="icon"><use href="#i-line" /></svg></button>
            <button class="btn ghost icon" data-annot="shape" data-value="arrow" data-i18n-label="edit.shape.arrow"><svg class="icon"><use href="#i-arrow" /></svg></button>
            </div>
            <span class="caption" data-i18n="edit.color"></span>
            <div class="swatches" data-annot-swatches></div>
            <label class="stacked" data-annot-only="shape ink"><span class="caption" data-i18n="edit.width"></span>
              <input class="input num" type="number" min="0.25" max="48" step="0.5" data-annot="width" />
            </label>
            <label class="inline checkbox" data-annot-only="fillable"><input type="checkbox" data-annot="filled" /><span data-i18n="edit.filled"></span></label>
          </div>
          <div id="prop-image-fields" class="properties-group" hidden>
            <label class="caption" for="prop-opacity" data-i18n="props.opacity"></label>
            <div class="slider-row">
              <input id="prop-opacity" class="slider" type="range" min="5" max="100" step="5" />
              <output id="prop-opacity-value" class="num" for="prop-opacity"></output>
            </div>
            <span class="caption" data-i18n="props.rotation"></span>
            <div class="segmented">
              <button id="prop-rotate-left" class="btn ghost icon" data-i18n-label="props.rotateLeft"><svg class="icon"><use href="#i-rotate-left" /></svg></button>
              <button id="prop-rotate-right" class="btn ghost icon" data-i18n-label="props.rotateRight"><svg class="icon"><use href="#i-rotate-right" /></svg></button>
            </div>
            <label class="inline checkbox"><input id="prop-keep-ratio" type="checkbox" /><span data-i18n="props.keepRatio"></span></label>
          </div>
          <div id="prop-arrange-fields" class="properties-group" hidden>
            <span class="caption" data-i18n="props.arrange"></span>
            <div class="segmented">
              <button class="btn ghost icon" data-arrange="left" data-i18n-label="props.alignLeft"><svg class="icon"><use href="#i-al-left" /></svg></button>
              <button class="btn ghost icon" data-arrange="center" data-i18n-label="props.alignCenter"><svg class="icon"><use href="#i-al-center" /></svg></button>
              <button class="btn ghost icon" data-arrange="right" data-i18n-label="props.alignRight"><svg class="icon"><use href="#i-al-right" /></svg></button>
              <button class="btn ghost icon" data-arrange="top" data-i18n-label="props.alignTop"><svg class="icon"><use href="#i-al-top" /></svg></button>
              <button class="btn ghost icon" data-arrange="middle" data-i18n-label="props.alignMiddle"><svg class="icon"><use href="#i-al-middle" /></svg></button>
              <button class="btn ghost icon" data-arrange="bottom" data-i18n-label="props.alignBottom"><svg class="icon"><use href="#i-al-bottom" /></svg></button>
            </div>
            <span class="caption" data-i18n="props.distribute"></span>
            <div class="segmented">
              <button class="btn ghost icon" data-arrange="distribute-x" data-i18n-label="props.distributeX"><svg class="icon"><use href="#i-dist-x" /></svg></button>
              <button class="btn ghost icon" data-arrange="distribute-y" data-i18n-label="props.distributeY"><svg class="icon"><use href="#i-dist-y" /></svg></button>
            </div>
            <p id="prop-arrange-note" class="caption" data-i18n="props.arrangeNote" hidden></p>
          </div>
          <div id="prop-geometry" class="properties-group">
            <span class="caption" data-i18n="props.position"></span>
            <div class="row2">
              <label class="inline"><span class="caption" aria-hidden="true">X</span><input id="prop-x" class="input num" inputmode="decimal" data-i18n-aria="props.x" /></label>
              <label class="inline"><span class="caption" aria-hidden="true">Y</span><input id="prop-y" class="input num" inputmode="decimal" data-i18n-aria="props.y" /></label>
              <label class="inline"><span class="caption" aria-hidden="true">L</span><input id="prop-width" class="input num" inputmode="decimal" data-i18n-aria="props.width" /></label>
              <label class="inline"><span class="caption" aria-hidden="true">H</span><input id="prop-height" class="input num" inputmode="decimal" data-i18n-aria="props.height" /></label>
            </div>
          </div>
          <div class="properties-group actions-row">
            <button id="prop-duplicate" class="btn" data-i18n="props.duplicate"></button>
            <button id="prop-replace" class="btn" data-i18n="props.replace" hidden></button>
            <button id="prop-delete" class="btn ghost danger" data-i18n="props.delete"></button>
          </div>
          </div>
        </aside>
      </div>

      <footer id="statusbar" class="statusbar" hidden>
        <span class="group">
          <label for="page-input" data-i18n="status.page"></label>&nbsp;
          <input id="page-input" class="input page-input num" type="number" min="1" data-i18n-label="status.pageInput" />
          &nbsp;<span id="page-count" class="num"></span>
        </span>
        <span class="group">
          <button id="zoom-out" class="btn ghost icon small" data-i18n-label="zoom.out" data-shortcut-hint="zoom_out"><svg class="icon"><use href="#i-minus" /></svg></button>
          <span id="zoom-value" class="zoom-value num" data-i18n-title="zoom.value"></span>
          <button id="zoom-in" class="btn ghost icon small" data-i18n-label="zoom.in" data-shortcut-hint="zoom_in"><svg class="icon"><use href="#i-plus" /></svg></button>
          <button id="fit-width" class="btn ghost icon small" data-i18n-label="zoom.fitWidth" data-shortcut-hint="fit_width"><svg class="icon"><use href="#i-fit-width" /></svg></button>
          <button id="fit-page" class="btn ghost icon small" data-i18n-label="zoom.fitPage" data-shortcut-hint="fit_page"><svg class="icon"><use href="#i-fit-page" /></svg></button>
        </span>
        <span class="spacer"></span>
        <span id="save-state" class="save-state" role="status"></span>
      </footer>
    </div>

    <section id="settings-view" class="settings-view" aria-labelledby="settings-title" hidden>
      <header class="topbar">
        <button id="settings-back" class="btn ghost"><svg class="icon"><use href="#i-back" /></svg><span data-i18n="settings.back"></span></button>
        <h1 id="settings-title" class="settings-heading" data-i18n="settings.title"></h1>
      </header>
      <div class="settings-body">
        <nav class="settings-nav" data-i18n-aria="settings.sections">
          <button class="nav-item" data-section="general" data-i18n="settings.general"></button>
          <button class="nav-item" data-section="display" data-i18n="settings.display"></button>
          <button class="nav-item" data-section="shortcuts" data-i18n="settings.shortcuts"></button>
          <button class="nav-item" data-section="edit" data-i18n="settings.edit"></button>
          <button class="nav-item" data-section="files" data-i18n="settings.files"></button>
          <button class="nav-item" data-section="diagnostic" data-i18n="settings.diagnostic"></button>
        </nav>
        <div class="settings-content">
          <p id="settings-warnings" class="notice" role="alert" hidden></p>

          <section class="settings-section" data-section="general">
            <h2 class="settings-section-title" data-i18n="settings.general"></h2>
            <div class="field">
              <label for="set-theme" data-i18n="settings.theme"></label>
              <select id="set-theme" class="input" data-setting="general.theme">
                <option value="system" data-i18n="settings.theme.system"></option>
                <option value="light" data-i18n="settings.theme.light"></option>
                <option value="dark" data-i18n="settings.theme.dark"></option>
              </select>
            </div>
            <div class="field">
              <label for="set-recent"><span data-i18n="settings.recentFiles"></span><span class="hint" data-i18n="settings.recentFiles.hint"></span></label>
              <input id="set-recent" class="input num narrow" type="number" min="0" max="50" data-setting="general.recent_files" data-type="number" />
            </div>
            <div class="field">
              <label for="set-reopen" data-i18n="settings.reopenLast"></label>
              <input id="set-reopen" class="switch" type="checkbox" role="switch" data-setting="general.reopen_last" />
            </div>
          </section>

          <section class="settings-section" data-section="display" hidden>
            <h2 class="settings-section-title" data-i18n="settings.display"></h2>
            <div class="field">
              <label for="set-zoom" data-i18n="settings.defaultZoom"></label>
              <select id="set-zoom" class="input" data-setting="display.default_zoom">
                <option value="fit_width" data-i18n="settings.defaultZoom.fit_width"></option>
                <option value="fit_page" data-i18n="settings.defaultZoom.fit_page"></option>
                <option value="actual" data-i18n="settings.defaultZoom.actual"></option>
              </select>
            </div>
            <div class="field">
              <label for="set-cache"><span data-i18n="settings.pageCache"></span><span class="hint" data-i18n="settings.pageCache.hint"></span></label>
              <input id="set-cache" class="input num narrow" type="number" min="64" max="2048" step="64" data-setting="display.page_cache_mb" data-type="number" />
            </div>
          </section>

          <section class="settings-section" data-section="shortcuts" hidden>
            <h2 class="settings-section-title" data-i18n="settings.shortcuts"></h2>
            <table class="shortcuts-table"><tbody id="shortcuts-body"></tbody></table>
            <div><button id="shortcuts-reset" class="btn" data-i18n="settings.shortcuts.reset"></button></div>
          </section>

          <section class="settings-section" data-section="edit" hidden>
            <h2 class="settings-section-title" data-i18n="settings.edit"></h2>
            <div class="field">
              <label for="set-author"><span data-i18n="settings.author"></span><span class="hint" data-i18n="settings.author.hint"></span></label>
              <input id="set-author" class="input" type="text" maxlength="200" autocomplete="name" data-setting="edit.author" />
            </div>
            <div class="field">
              <label for="set-font" data-i18n="settings.font"></label>
              <select id="set-font" class="input" data-setting="edit.font">
                <option value="sans" data-i18n="font.sans"></option>
                <option value="serif" data-i18n="font.serif"></option>
                <option value="mono" data-i18n="font.mono"></option>
              </select>
            </div>
            <div class="field">
              <label for="set-font-size" data-i18n="settings.fontSize"></label>
              <input id="set-font-size" class="input num narrow" type="number" min="4" max="200" step="0.5" data-setting="edit.font_size" data-type="number" />
            </div>
            <div class="field">
              <label for="set-text-color" data-i18n="settings.textColor"></label>
              <input id="set-text-color" class="color-input" type="color" data-setting="edit.text_color" />
            </div>
            <div class="field">
              <label for="set-highlight-color" data-i18n="settings.highlightColor"></label>
              <input id="set-highlight-color" class="color-input" type="color" data-setting="edit.highlight_color" />
            </div>
            <div class="field">
              <label for="set-snap"><span data-i18n="settings.snap"></span><span class="hint" data-i18n="settings.snap.hint"></span></label>
              <input id="set-snap" class="switch" type="checkbox" role="switch" data-setting="edit.snap" />
            </div>
            <div class="field">
              <label for="set-grid"><span data-i18n="settings.grid"></span><span class="hint" data-i18n="settings.grid.hint"></span></label>
              <input id="set-grid" class="input num narrow" type="number" min="0" max="50" step="0.5" data-setting="edit.grid_mm" data-type="number" />
            </div>
          </section>

          <section class="settings-section" data-section="files" hidden>
            <h2 class="settings-section-title" data-i18n="settings.files"></h2>
            <div class="field">
              <label for="set-autosave"><span data-i18n="settings.autosave"></span><span class="hint" data-i18n="settings.autosave.hint"></span></label>
              <select id="set-autosave" class="input" data-setting="files.autosave_seconds" data-type="number">
                <option value="0" data-i18n="settings.autosave.off"></option>
                <option value="30" data-i18n="settings.autosave.30"></option>
                <option value="60" data-i18n="settings.autosave.60"></option>
                <option value="120" data-i18n="settings.autosave.120"></option>
                <option value="300" data-i18n="settings.autosave.300"></option>
                <option value="600" data-i18n="settings.autosave.600"></option>
              </select>
            </div>
            <div class="field">
              <label for="set-default-dir"><span data-i18n="settings.defaultDir"></span><span class="hint" data-i18n="settings.defaultDir.hint"></span></label>
              <span class="actions">
                <input id="set-default-dir" class="input" type="text" data-setting="files.default_dir" data-i18n-placeholder="settings.defaultDir.none" />
                <button id="pick-default-dir" class="btn" type="button" data-i18n="settings.defaultDir.pick"></button>
              </span>
            </div>
            <div class="field">
              <label for="set-copy-suffix"><span data-i18n="settings.copySuffix"></span><span class="hint" data-i18n="settings.copySuffix.hint"></span></label>
              <input id="set-copy-suffix" class="input" type="text" maxlength="40" data-setting="files.copy_suffix" />
            </div>
          </section>

          <section class="settings-section" data-section="diagnostic" hidden>
            <h2 class="settings-section-title" data-i18n="settings.diagnostic"></h2>
            <div class="field">
              <label for="set-updates"><span data-i18n="settings.updatesCheck"></span><span class="hint" data-i18n="settings.updatesCheck.hint"></span></label>
              <input id="set-updates" class="switch" type="checkbox" role="switch" data-setting="updates.check" />
            </div>
            <div class="field">
              <span id="update-check-status" class="muted" role="status"></span>
              <span class="actions">
                <button id="update-check" class="btn" data-i18n="updates.check"></button>
                <button id="settings-update-install" class="btn primary" hidden></button>
              </span>
            </div>
            <div class="field">
              <label for="set-log"><span data-i18n="settings.logLevel"></span><span class="hint" data-i18n="settings.logLevel.hint"></span></label>
              <select id="set-log" class="input" data-setting="diagnostic.log_level">
                <option value="error" data-i18n="settings.logLevel.error"></option>
                <option value="warn" data-i18n="settings.logLevel.warn"></option>
                <option value="info" data-i18n="settings.logLevel.info"></option>
                <option value="debug" data-i18n="settings.logLevel.debug"></option>
              </select>
            </div>
            <div class="field">
              <span id="app-version" class="muted"></span>
              <button id="open-logs" class="btn" data-i18n="settings.openLogs"></button>
            </div>
            <details class="notes-details">
              <summary data-i18n="settings.notes"></summary>
              <div id="installed-notes" class="release-list"></div>
            </details>
          </section>
        </div>
      </div>
      <footer class="settings-footer">
        <span id="settings-dirty" class="muted"></span>
        <button id="settings-cancel" class="btn" data-i18n="settings.cancel"></button>
        <button id="settings-save" class="btn primary" data-i18n="settings.save" disabled></button>
      </footer>
    </section>

    <dialog id="password-dialog" aria-labelledby="password-title">
      <form method="dialog">
        <div class="dialog-body">
          <h2 id="password-title" class="dialog-title" data-i18n="password.title"></h2>
          <p id="password-text"></p>
          <label>
            <span data-i18n="password.label"></span>
            <input id="password-input" class="input" type="password" autocomplete="off" />
          </label>
          <p id="password-error" class="dialog-error" role="alert" data-i18n="password.wrong" hidden></p>
        </div>
        <div class="dialog-actions">
          <!-- type="button" : Entrée valide le formulaire avec « Ouvrir », jamais « Annuler ». -->
          <button id="password-cancel" class="btn" type="button" data-i18n="password.cancel"></button>
          <button class="btn primary" value="ok" data-i18n="password.submit"></button>
        </div>
      </form>
    </dialog>

    <dialog id="redact-dialog" aria-labelledby="redact-title">
      <div class="dialog-body">
        <h2 id="redact-title" class="dialog-title" data-i18n="redact.title"></h2>
        <p id="redact-text"></p>
      </div>
      <div class="dialog-actions">
        <button id="redact-cancel" class="btn" type="button" data-i18n="redact.cancel"></button>
        <button id="redact-confirm" class="btn destructive" type="button" data-i18n="redact.confirm"></button>
      </div>
    </dialog>

    <dialog id="props-dialog" aria-labelledby="props-title">
      <form id="props-form">
        <div class="dialog-body">
          <h2 id="props-title" class="dialog-title" data-i18n="props.docTitle"></h2>
          <label><span data-i18n="meta.title"></span><input id="meta-title" class="input" maxlength="2000" /></label>
          <label><span data-i18n="meta.author"></span><input id="meta-author" class="input" maxlength="2000" /></label>
          <label><span data-i18n="meta.subject"></span><input id="meta-subject" class="input" maxlength="2000" /></label>
          <label><span data-i18n="meta.keywords"></span><input id="meta-keywords" class="input" maxlength="2000" /></label>
          <p class="caption" data-i18n="meta.hint"></p>
        </div>
        <div class="dialog-actions">
          <button id="props-cancel" class="btn" type="button" data-i18n="meta.cancel"></button>
          <button class="btn primary" type="submit" data-i18n="meta.apply"></button>
        </div>
      </form>
    </dialog>

    <dialog id="unsaved-dialog" aria-labelledby="unsaved-title">
      <div class="dialog-body">
        <h2 id="unsaved-title" class="dialog-title" data-i18n="unsaved.title"></h2>
        <p id="unsaved-text"></p>
      </div>
      <div class="dialog-actions">
        <button id="unsaved-cancel" class="btn" type="button" data-i18n="unsaved.cancel"></button>
        <button id="unsaved-discard" class="btn" type="button" data-i18n="unsaved.discard"></button>
        <button id="unsaved-save" class="btn primary" type="button" data-i18n="unsaved.save"></button>
      </div>
    </dialog>

    <dialog id="recovery-dialog" aria-labelledby="recovery-title">
      <div class="dialog-body">
        <h2 id="recovery-title" class="dialog-title" data-i18n="recovery.title"></h2>
        <p id="recovery-text"></p>
      </div>
      <div class="dialog-actions">
        <button id="recovery-discard" class="btn ghost danger" type="button" data-i18n="recovery.discard"></button>
        <button id="recovery-later" class="btn" type="button" data-i18n="recovery.later"></button>
        <button id="recovery-restore" class="btn primary" type="button" data-i18n="recovery.restore"></button>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
