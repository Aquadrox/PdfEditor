<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil : aucun document ouvert</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.app{--desk:#E3E6EA;--surface:#F6F7F8;--raised:#FFFFFF;--paper:#FFFFFF;--ink:#1C2430;--muted:#566170;--line:#D5DAE0;--accent:#2747B8;--accent-soft:#E6EBFA;--accent-fg:#FFFFFF;--seal:#8A1C2B;--seal-soft:#F6E7E9;--seal-fg:#FFFFFF;--ok:#1E7344;--shadow:0 1px 2px rgba(20,28,40,.12),0 10px 28px rgba(20,28,40,.12);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:1.45;color:var(--ink);background:var(--surface)}
.app.dark{--desk:#181B1F;--surface:#22262B;--raised:#2A2F35;--ink:#E6E9ED;--muted:#9AA4AF;--line:#343A41;--accent:#8FA6FF;--accent-soft:#283252;--accent-fg:#141821;--seal:#F0909C;--seal-soft:#3A2328;--seal-fg:#2A0F14;--ok:#5CC98D;--shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45)}
.app *{box-sizing:border-box}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.lg{height:36px;padding:0 16px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--desk);color:var(--ink)}
.btn.icon{width:28px;padding:0;justify-content:center}
.lbl{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
kbd{font:inherit;font-size:11px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;color:var(--muted);background:var(--raised)}
.recent{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border:0;border-radius:6px;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.recent:hover{background:var(--surface)}
.mini{width:44px;height:58px;background:var(--paper);box-shadow:0 0 0 1px var(--line);padding:7px 6px;display:flex;flex-direction:column;gap:3px}
.mini i{display:block;height:2px;background:#C9CED6}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.wx{width:18px;height:18px;display:grid;place-items:center;border-radius:48% 52% 50% 50% / 52% 48% 52% 48%}
.wx svg.i{width:11px;height:11px}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 100%; height: 900px; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--surface)">
<button class="btn ghost icon" aria-label="Menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<span style="font-weight: 600">PdfEditor</span>
<span style="flex: 1"></span>
<button class="btn ghost"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Réglages</button>
</header>

<main style="flex: 1; min-height: 0; background: var(--desk); display: flex; gap: 48px; padding: 56px 64px; flex-wrap: wrap; justify-content: center; overflow: hidden">

<section aria-label="Ouvrir un document" style="flex: 0 1 420px; display: flex; flex-direction: column; align-items: center">
<div style="width: 420px; max-width: 100%; aspect-ratio: 210 / 297; background: var(--paper); box-shadow: var(--shadow); outline: 2px dashed var(--line); outline-offset: -18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 48px; text-align: center; color: #1C2430">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 36px; height: 36px; color: #566170; stroke-width: 1.5"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 18v-6M9 15l3-3 3 3"/></svg>
<div style="font-size: 18px; font-weight: 600">Ouvrez un PDF ou déposez-le ici</div>
<div style="font-size: 13px; color: #566170; max-width: 30ch">Le fichier d'origine n'est jamais modifié tant que vous n'enregistrez pas.</div>
<button class="btn primary lg" style="background: #2747B8; border-color: #2747B8; color: #fff">Ouvrir un PDF</button>
<span style="font-size: 12px; color: #566170"><kbd style="color: #566170; background: #fff; border-color: #D5DAE0">Ctrl</kbd> <kbd style="color: #566170; background: #fff; border-color: #D5DAE0">O</kbd></span>
</div>
</section>

<section aria-labelledby="recent-title" style="flex: 1 1 420px; max-width: 560px; display: flex; flex-direction: column; gap: 24px">
<div style="background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px">
<h2 id="recent-title" style="font-size: 15px; font-weight: 600; margin: 0">Documents récents</h2>
<button class="btn ghost">Effacer la liste</button>
</div>
<button class="recent"><span class="mini"><i style="width: 60%; margin: 0 auto 3px"></i><i></i><i style="width: 80%"></i><i></i><i style="width: 60%"></i></span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600">contrat-prestation-2026.pdf</span><span class="lbl">Documents\Clients\Nordtech, ouvert il y a 10 min</span></span>
<span class="state" style="color: var(--seal)"><span class="wx" style="border: 1.5px solid var(--seal)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c3-3 5-7 7-7s-1 7 2 7 3-4 5-4 2 3 4 3"/></svg></span>Cycle en cours, 1 sur 3</span></button>
<button class="recent"><span class="mini"><i></i><i style="width: 70%"></i><i></i><i></i><i style="width: 50%"></i></span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600">attestation-assurance-2026.pdf</span><span class="lbl">Téléchargements, hier</span></span>
<span class="state" style="color: var(--seal)"><span class="wx" style="background: var(--seal); color: var(--seal-fg)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>Signé et verrouillé</span></button>
<button class="recent"><span class="mini"><i style="width: 50%"></i><i></i><i></i><i style="width: 90%"></i><i></i></span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600">devis-renovation-cuisine.pdf</span><span class="lbl">Documents\Maison, 12 novembre</span></span>
<span class="state lbl">Non signé</span></button>
<button class="recent"><span class="mini"><i></i><i></i><i style="width: 60%"></i><i></i><i style="width: 75%"></i></span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600">notice-technique-EN.pdf</span><span class="lbl">Documents\Atelier, 9 novembre</span></span>
<span class="state lbl">Traduction enregistrée</span></button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="font-size: 15px; font-weight: 600; margin: 0">Créer</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button class="btn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="12" height="15" rx="1"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/></svg>Fusionner des PDF</button>
<button class="btn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>Assembler des images en PDF</button>
<button class="btn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>Document vierge</button>
</div>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Clair","Sombre"],"default":"Clair"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const dark = (this.props.theme ?? 'Clair') === 'Sombre';
return { themeClass: dark ? 'app dark' : 'app' };
}
}
</script>
</body>
</html>
