name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Un nouveau push sur une PR annule la vérification devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Les jobs `linux`, `windows` et `secrets` sont obligatoires pour merger sur
# `main` (voir CONTRIBUTING.md). Le job `release` ne tourne que sur un tag.
jobs:
  linux:
    runs-on: ubuntu-latest
    # Un outil bloqué ne doit pas occuper la CI 6 h (délai par défaut).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Une release v1.2.3 doit contenir la version 1.2.3 : sinon l'installeur
      # publié afficherait une autre version.
      - name: Version du tag = version du code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, mais Cargo.toml indique $version : monter la version avant de taguer"
            exit 1
          fi
      # Chaque version a ses notes, affichées avec la mise à jour.
      - name: Notes de version (CHANGELOG.md)
        run: python3 .github/scripts/changelog.py check
      # Dépendances : aucune vulnérabilité connue, licences compatibles,
      # sources crates.io (deny.toml).
      - name: Dépendances (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # Bibliothèques de Tauri sous Linux (WebView WebKitGTK).
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache alimenté par `main` seulement, réutilisé par les PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Bibliothèque PDFium figée, empreinte SHA-256 vérifiée (moteur PDF).
      - name: PDFium
        shell: bash
        run: ./scripts/fetch-pdfium.sh
      - name: Formatage
        run: cargo fmt --all --check
      - name: Clippy (avertissements = erreurs)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests de non-régression
        run: cargo test --workspace
      # Modules JS purs de l'interface (zoom, disposition, traductions).
      - name: Tests de l'interface (modules)
        working-directory: apps/desktop/ui
        run: node --test
      # Parcours de l'interface dans Chromium, Tauri simulé.
      - name: Tests de l'interface (parcours)
        working-directory: apps/desktop/ui-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Bibliothèque PDFium figée, empreinte SHA-256 vérifiée (moteur PDF).
      - name: PDFium
        shell: bash
        run: ./scripts/fetch-pdfium.sh
      - name: Clippy (avertissements = erreurs)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests de non-régression
        run: cargo test --workspace
      # Installeur NSIS avec PDFium (tauri.windows.conf.json). CLI Tauri
      # précompilée par npm : rien à compiler en plus.
      - name: Installeur
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis
      # Release : installeur signé pour la mise à jour automatique. Les secrets
      # ne sont lus qu'ici (tags), jamais dans les PR.
      - name: Installeur signé (release)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY absent : impossible de signer la release"
            exit 1
          fi
          # Sans clé publique, l'application publiée ne pourrait vérifier
          # aucune mise à jour : on ne publie pas.
          if grep -q '"pubkey": ""' tauri.conf.json; then
            echo "::error::clé publique absente de tauri.conf.json (plugins.updater.pubkey)"
            exit 1
          fi
          npx --yes @tauri-apps/cli@^2 build --bundles nsis --config updater.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: PdfEditor-installeur-windows
          # .sig : signature de l'installeur (releases uniquement).
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 14

  # Aucun secret dans le dépôt : tout l'historique de la branche est analysé.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publication (tags vX.Y.Z posés par ./release.sh) : release GitHub avec
  # l'installeur signé et le manifeste lu par la mise à jour automatique
  # (releases/latest/download/latest.json).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/download-artifact@v8
        with:
          name: PdfEditor-installeur-windows
      # Notes de version : en tête de la release, et dans le champ `changelog`
      # du manifeste, que l'application affiche avec la mise à jour proposée.
      - name: Notes de version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 src/.github/scripts/changelog.py manifest "$TAG" > changelog.txt
          {
            echo "## Nouveautés"
            echo
            python3 src/.github/scripts/changelog.py notes "$TAG"
          } > notes.md
          cat notes.md
      - name: Manifeste de mise à jour
        env:
          TAG: ${{ github.ref_name }}
        run: |
          exe=$(ls *.exe)
          test -f "$exe.sig" || { echo "::error::signature $exe.sig absente"; exit 1; }
          EXE="$exe" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          tag, repo, exe = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"], os.environ["EXE"]
          windows = {
              "signature": open(f"{exe}.sig").read().strip(),
              "url": f"https://github.com/{repo}/releases/download/{tag}/{exe}",
          }
          manifest = {
              "version": tag.removeprefix("v"),
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "changelog": open("changelog.txt", encoding="utf-8").read().strip(),
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"windows-x86_64": windows, "windows-x86_64-nsis": windows},
          }
          json.dump(manifest, open("latest.json", "w"), indent=2, ensure_ascii=False)
          PY
          cat latest.json
      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" *.exe *.exe.sig latest.json --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md
