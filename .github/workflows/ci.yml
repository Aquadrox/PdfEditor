name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Un nouveau push sur une PR annule la vérification devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Les trois jobs sont obligatoires pour merger sur `main` (voir CONTRIBUTING.md).
jobs:
  linux:
    runs-on: ubuntu-latest
    # Un outil bloqué ne doit pas occuper la CI 6 h (délai par défaut).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Bibliothèques de Tauri sous Linux (WebView WebKitGTK).
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache alimenté par `main` seulement, réutilisé par les PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Bibliothèque PDFium figée, empreinte SHA-256 vérifiée (moteur PDF).
      - name: PDFium
        shell: bash
        run: ./scripts/fetch-pdfium.sh
      - name: Formatage
        run: cargo fmt --all --check
      - name: Clippy (avertissements = erreurs)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests de non-régression
        run: cargo test --workspace
      # Modules JS purs de l'interface (zoom, disposition, traductions).
      - name: Tests de l'interface (modules)
        working-directory: apps/desktop/ui
        run: node --test
      # Parcours de l'interface dans Chromium, Tauri simulé.
      - name: Tests de l'interface (parcours)
        working-directory: apps/desktop/ui-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Bibliothèque PDFium figée, empreinte SHA-256 vérifiée (moteur PDF).
      - name: PDFium
        shell: bash
        run: ./scripts/fetch-pdfium.sh
      - name: Clippy (avertissements = erreurs)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests de non-régression
        run: cargo test --workspace

  # Aucun secret dans le dépôt : tout l'historique de la branche est analysé.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
